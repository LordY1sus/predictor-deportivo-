name: Build APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: | python -m pip install --upgrade pip pip install "flet==1.1.3" "flet-cli==1.1.3" numpy==2.5.4 httpx==0.28.1 pytest 
      - name: Pruebas (si fallan, no se compila)
        run: python -m pytest -q

      - name: Compilar APK para el POCO X3 NFC (Snapdragon 732G, arm64-v8a)
        run: flet build apk --arch arm64-v8a --module-name main --log-format github -v

      - uses: actions/upload-artifact@v4
        with:
          name: sportsquant-apk
          path: build/apk/*.apk
          if-no-files-found: error
