name: Build Predictor Deportivo APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "predictor_deportivo_fuente_v0_34.zip"

permissions:
  contents: read

concurrency:
  group: predictor-deportivo-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract project archive
        run: |
          set -euo pipefail
          test -f predictor_deportivo_fuente_v0_34.zip
          mkdir -p source
          unzip -q predictor_deportivo_fuente_v0_34.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name buildozer.spec -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile Python sources
        run: |
          cd "$PROJECT_DIR"
          python -m compileall -q app main.py tests

      - name: Run automated tests
        run: |
          cd "$PROJECT_DIR"
          python -m unittest discover -s tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf \
            libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Verify APK and ARM64 support
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$PROJECT_DIR"/bin/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Se esperaba exactamente una APK; se encontraron ${#apks[@]}" >&2
            exit 1
          fi
          unzip -t "${apks[0]}"
          unzip -Z1 "${apks[0]}" | grep -q '^lib/arm64-v8a/'
          sha256sum "${apks[0]}" > "$PROJECT_DIR/bin/SHA256SUMS.txt"
          cat "$PROJECT_DIR/bin/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictor-deportivo-v0.34-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
            ${{ env.PROJECT_DIR }}/bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
